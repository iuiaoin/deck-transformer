<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background-color: #e0e0e0;
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    html, body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }
    .slide {
      width: 1280px; height: 720px;
      background-color: #F7F4EF;
      position: relative; overflow: hidden;
      box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: center;
      padding: 80px 120px;
    }
    @keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInContent { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    h1 {
      color: #2B2A27; font-size: 56px; font-weight: 700; margin: 0 0 55px;
      letter-spacing: -0.5px;
      animation: slideInUp 0.6s ease-out;
    }
    .agenda-items { display: flex; flex-direction: column; gap: 28px; }
    .agenda-item {
      display: flex; align-items: flex-start; gap: 24px;
      opacity: 0; animation: slideInUp 0.5s ease-out forwards;
    }
    .agenda-item:nth-child(1) { animation-delay: 0.2s; }
    .agenda-item:nth-child(2) { animation-delay: 0.35s; }
    .agenda-item:nth-child(3) { animation-delay: 0.5s; }
    .item-number {
      flex-shrink: 0; width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #F7F4EF;
    }
    .item-number.n1 { background-color: #E07A59; }
    .item-number.n2 { background-color: #5D4E42; }
    .item-number.n3 { background-color: #9FD3B8; }
    .item-content { flex: 1; }
    .item-title { font-size: 26px; font-weight: 700; color: #2B2A27; margin-bottom: 4px; }
    .item-desc { font-size: 18px; color: #5D4E42; line-height: 1.5; }
    .item-slides { font-size: 14px; color: #9E9086; margin-top: 4px; font-weight: 500; }
    .proportion-bar {
      display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 45px;
      opacity: 0; animation: fadeInContent 0.6s ease-out 0.7s forwards;
    }
    .proportion-bar .seg1 { flex: 50; background-color: #E07A59; }
    .proportion-bar .seg2 { flex: 35; background-color: #5D4E42; }
    .proportion-bar .seg3 { flex: 15; background-color: #9FD3B8; }
    .footer {
      position: absolute; bottom: 30px; right: 60px;
      font-size: 14px; color: #9E9086; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="slide">
    <h1>目录</h1>
    <div class="agenda-items">
      <div class="agenda-item">
        <div class="item-number n1">1</div>
        <div class="item-content">
          <div class="item-title">Attention 机制</div>
          <div class="item-desc">从字典查找到 Multi-Head Attention</div>
          <div class="item-slides">第 3 &ndash; 9 页 &middot; ~50%</div>
        </div>
      </div>
      <div class="agenda-item">
        <div class="item-number n2">2</div>
        <div class="item-content">
          <div class="item-title">Transformer 架构</div>
          <div class="item-desc">Positional Encoding、Encoder、Decoder 及其组合方式</div>
          <div class="item-slides">第 10 &ndash; 13 页 &middot; ~35%</div>
        </div>
      </div>
      <div class="agenda-item">
        <div class="item-number n3">3</div>
        <div class="item-content">
          <div class="item-title">下游范式</div>
          <div class="item-desc">BERT、GPT、T5 &mdash;&mdash; 及其延伸</div>
          <div class="item-slides">第 14 页 &middot; ~15%</div>
        </div>
      </div>
    </div>
    <div class="proportion-bar">
      <div class="seg1"></div>
      <div class="seg2"></div>
      <div class="seg3"></div>
    </div>
    <div class="footer">2 / 15</div>
  </div>
</body>
</html>
